name: health

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HEALTH_URL: https://pokedraft-woad.vercel.app/api/health?db=1
      ISSUE_TITLE: Production health check failing
      # A merge takes a few minutes to deploy; a sha mismatch inside this window is not a failure.
      DEPLOY_GRACE_SECONDS: "1200"
    steps:
      - name: Check status and served sha
        id: check
        run: |
          set -uo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          main_at=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .commit.committer.date)
          body=""
          code=000
          for _ in 1 2 3; do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 20 "$HEALTH_URL") || code=000
            body=$(cat health.json 2>/dev/null || true)
            [ "$code" = 200 ] && break
            sleep 20
          done
          db=$(jq -r '.db.status // "missing"' health.json 2>/dev/null || echo unparsable)
          served=$(jq -r '.sha // "missing"' health.json 2>/dev/null || echo unparsable)
          age=$(( $(date -u +%s) - $(date -u -d "$main_at" +%s) ))
          problem=""
          if [ "$code" != 200 ] || [ "$db" != ok ]; then
            problem="HTTP $code, db.status $db"
          elif [ "$served" != "$main_sha" ] && [ "$age" -ge "$DEPLOY_GRACE_SECONDS" ]; then
            problem="production serves $served but main is $main_sha (merged ${age}s ago)"
          fi
          echo "main=$main_sha served=$served http=$code db=$db main_age=${age}s"
          {
            echo "problem=$problem"
            delim="health_$(openssl rand -hex 8)"
            echo "detail<<$delim"
            echo "main: $main_sha"
            echo "served: $served"
            echo "HTTP: $code, db.status: $db"
            echo "response: $body"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      - name: Open or update the issue
        if: steps.check.outputs.problem != ''
        env:
          PROBLEM: ${{ steps.check.outputs.problem }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fence='```'
          text=$(printf "%s\n\n%s\n%s\n%s\n\nRun: %s\n" "$PROBLEM" "$fence" "$DETAIL" "$fence" "$run_url")
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$text"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$text"
          fi
          echo "::error::$PROBLEM"
          exit 1
