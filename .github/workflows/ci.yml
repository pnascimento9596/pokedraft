name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the pinned PokéAPI CSVs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/data/.cache/c80757193bd0889054e36f4209762360bdaa4b95
          key: pokeapi-csv-c80757193bd0889054e36f4209762360bdaa4b95-${{ hashFiles('scripts/data/build-pokedex.mjs', 'scripts/data/build-type-chart.mjs') }}
      - run: pnpm check:mirrors
      - run: pnpm check:image-seam
      - run: pnpm check:image-packs
      - run: pnpm check:theme-contrast
      - run: pnpm check:theme-colors
      - run: pnpm check:dashes
      - run: pnpm check:breakpoints
      - run: pnpm check:theme-cvd
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=4
      - run: pnpm build
      - run: pnpm exec tsx scripts/build/check-retained-replays.mts .next/server/chunks
      - run: node scripts/build/measure-retained-json.mjs .next/server/chunks
      - run: pnpm check:client-bundle
      - name: Rebuild data artifacts and require zero diff
        run: |
          pnpm data:pokedex
          pnpm data:scouting
          pnpm data:type-chart
          git diff --exit-code -- src/data
      - name: Check review move citations against the pinned learnset
        run: pnpm data:check-moves

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_DRIVER: pg
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:smoke
      - run: |
          pnpm db:rollback
          pnpm db:rollback
          pnpm db:rollback
          pnpm db:rollback
      - name: Print remaining migration count after four rollbacks
        run: |
          pnpm exec tsx -e '
            import { connect } from "./scripts/db/connect.mjs";
            connect().sql.query("SELECT count(*) FROM drizzle.__drizzle_migrations").then(([row]) => {
              console.log("[db:count] " + row.count + " migration(s) recorded");
              if (Number(row.count) !== 3) throw new Error("expected 3 migrations remaining, got " + row.count);
            });
          '
      - run: pnpm db:migrate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The suite is about 6,700 test-seconds, CPU bound on the phone projects. Eight shards on
    # separate runners cut the wall clock to roughly an eighth plus the per-job setup.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/8
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
